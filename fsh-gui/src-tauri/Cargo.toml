[package]
name = "fsh-gui"
version = "0.1.0"
description = "Fuyao Skills Hub 桌面端（Tauri）"
edition = "2024"

# 独立构建单元：脱离仓库根 workspace，依赖解析与构建产物均在 fsh-gui 内闭环
[workspace]

# 更多键及其定义见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀看似冗余，实则必要：
# 它让 lib 名保持唯一，不会与 bin 名冲突。
# 这似乎只在 Windows 上是个问题，见 https://github.com/rust-lang/cargo/issues/8519
name = "fsh_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 阅读优化指南了解更多细节：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
