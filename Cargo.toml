[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# 跨 crate 共享的依赖统一在此声明版本，成员以 workspace = true 引用；
# tauri 系依赖与桌面端 GUI 运行时强绑定，只在 src-tauri 内声明，不进入此表
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# GUI 与 CLI 的 JSON 信封；core 侧机器写文件全 TOML
serde_json = "1"
# git 真身模型：libgit2 静态链接，0.21 起默认零网络依赖（openssl/ssh 均为可选 feature）
git2 = "0.21"
# 库 crate 结构化错误
thiserror = "2"
# tag 内容树哈希（GC 脏目录判定）
blake3 = "1"
# hub / 项目侧配置与声明文件序列化（官方维护的 toml 实现）
toml = "1.1"
# NTFS junction：目录链接三级降级的无门槛主力方案
junction = "2.1"
# 测试用临时目录
tempfile = "3"
# CLI 参数解析（derive 宏），fsh-cli 命令面
clap = { version = "4.6", features = ["derive"] }
# 结构化日志（事件 + 字段）；core 侧清扫跳过等关键事件走 INFO
tracing = "0.1"
# subscriber 分层（文件 + stderr）与 EnvFilter 级别过滤
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
# 日志文件按天/小时滚动，非阻塞写入由 WorkerGuard 在进程退出时 flush
tracing-appender = "0.2"
# chrono 提供本地时区计时
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 目录遍历：尊重 hub 白名单式 .gitignore 的内容检索扫描（export/logs/.lock 天然不可见）
ignore = "0.4"
# 行导向检索执行器：逐行匹配与行号定位
grep-searcher = "0.1"
# 行匹配器接口：正则匹配的统一抽象（smart-case / 字面量 / 整词开关在此层生效）
grep-matcher = "0.1"
# 正则匹配器实现：编译模式并执行行匹配（smart-case / 字面量 / 整词的具体语义）
grep-regex = "0.1"
# glob 匹配：检索的命中过滤层（正向并集保留、负向剔除），遍历根恒为 hub 根
globset = "0.4"
# 编译期内嵌目录：仓库 skills\ 整份进二进制，发布产物仍只有一个 exe
include_dir = "0.7"

# 开发构建瘦身：保留行号级调试信息（panic 栈可定位），不生成变量级信息
[profile.dev]
debug = "line-tables-only"

# 依赖不生成 debuginfo（体积大头），O1 让测试运行更快、编译时间几乎不变
# 需要完整调试信息时用环境变量临时覆盖：CARGO_PROFILE_DEV_DEBUG=2
[profile.dev.package."*"]
debug = false
opt-level = 1

# 发布构建体积优先：单 codegen 单元 + LTO + 符号剥离，panic 直接终止不再展开
# 阅读优化指南了解更多细节：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
