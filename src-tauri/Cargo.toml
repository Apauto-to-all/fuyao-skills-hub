[package]
name = "fsh-gui"
version.workspace = true
description = "Fuyao Skills Hub 桌面端（Tauri）"
edition.workspace = true
license.workspace = true

# 更多键及其定义见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀看似冗余，实则必要：
# 它让 lib 名保持唯一，不会与 bin 名冲突。
# 这似乎只在 Windows 上是个问题，见 https://github.com/rust-lang/cargo/issues/8519
name = "fsh_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# 产物名跟设计文档的安装目录约定：CLI 是 fsh.exe，GUI 是 fuyao-skills-hub.exe
name = "fuyao-skills-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri 系依赖只在桌面端声明：与 GUI 运行时强绑定，不进入 workspace 统一管理
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 业务逻辑与日志装配全在 core，桌面端只做壳
fsh-core = { version = "0.1.0", path = "../crates/fsh-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-window-state = "2"
