[package]
name = "fsh-gui"
version.workspace = true
description = "Fuyao Skills Hub 桌面端（Tauri）"
edition.workspace = true
license.workspace = true

# 更多键及其定义见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀看似冗余，实则必要：
# 它让 lib 名保持唯一，不会与 bin 名冲突。
# 这似乎只在 Windows 上是个问题，见 https://github.com/rust-lang/cargo/issues/8519
name = "fsh_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri 系依赖只在桌面端声明：与 GUI 运行时强绑定，不进入 workspace 统一管理
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
